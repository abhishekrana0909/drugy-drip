<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drugy Drip logo options</title>
<link rel="icon" href="../../images/favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; padding: 32px 20px 60px; background: #161616; color: #eee; font: 15px/1.5 system-ui, sans-serif; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p { margin: 0 0 28px; color: #9a9a9a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 22px; }
  figure { margin: 0; background: #202020; border-radius: 14px; overflow: hidden; }
  figure img { width: 100%; display: block; }
  figcaption { padding: 10px 14px; font-weight: 600; }
  figcaption span { display: block; font-weight: 400; color: #9a9a9a; font-size: 13px; }
  .wide { grid-column: 1 / -1; }
  .wide img { max-width: 900px; margin: 0 auto; }
  .row { display: flex; gap: 22px; align-items: center; padding: 18px; background: #f3eee4; }
</style>
</head>
<body>
  <h1>Drugy Drip: logo options</h1>
  <p>Generated by tools/logo/make_logo.py</p>
  <div class="grid">
    <figure><img src="../../images/logo/drugydrip-leafcut-tall.svg" alt=""><figcaption>L1. Leaf-cut Tall<span>Letters cut out of leaves, tall font</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-leafcut-heavy.svg" alt=""><figcaption>L2. Leaf-cut Heavy<span>Letters cut out of leaves, wide font</span></figcaption></figure>
    <figure class="wide"><img src="../../images/logo/drugydrip-leafcut-wordmark.svg" alt="" style="background:#111"><figcaption>Leaf-cut wordmark<span>One line, transparent background</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-real-chrome.svg" alt=""><figcaption>R1. Chrome<span>Realistic leaf, chrome letters with drips</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-real-gold.svg" alt=""><figcaption>R2. Gold<span>Realistic leaf, gold letters with drips</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-real-gothic.svg" alt=""><figcaption>R3. Gothic<span>Realistic leaf, blackletter streetwear text</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-og-green.svg" alt=""><figcaption>1. OG Green<span>Neon green leaf, white drippy letters</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-purple-haze.svg" alt=""><figcaption>2. Purple Haze<span>Purple leaf, lime letters, pink shadow</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-toxic.svg" alt=""><figcaption>3. Toxic<span>Dark leaf, neon green letters</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-graffiti.svg" alt=""><figcaption>4. Graffiti<span>Spray-paint letters, pink shadow</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-light.svg" alt=""><figcaption>5. Light<span>For white tees and tags</span></figcaption></figure>
    <figure><img src="../../images/logo/drugydrip-icon.svg" alt="" style="padding:40px;box-sizing:border-box"><figcaption>Icon<span>Favicon / profile picture</span></figcaption></figure>
    <figure class="wide"><img src="../../images/logo/drugydrip-wordmark.svg" alt=""><figcaption>Wordmark (no leaf)<span>For ads, website header, tags</span></figcaption></figure>
  </div>
</body>
</html>
